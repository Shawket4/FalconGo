name: Build and Deploy Falcon Go App

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: "1.21"
          cache: true

      - name: Install dependencies
        run: go mod download

      - name: Ensure HTTP on localhost
        run: |
          echo "Checking Listen configuration in FiberConfig/Routes.go..."
          if grep -qE "^\s*app\.ListenTLS" FiberConfig/Routes.go; then
            sed -i 's|^\(\s*\)app\.ListenTLS(.*|\1// &|g' FiberConfig/Routes.go
          fi
          if grep -q "// app.Listen" FiberConfig/Routes.go; then
            sed -i 's|// app\.Listen(":3001")|app.Listen("127.0.0.1:3001")|g' FiberConfig/Routes.go
          fi
          if grep -qE "^\s*app\.Listen\(\":3001\"\)" FiberConfig/Routes.go; then
            sed -i 's|app\.Listen(":3001")|app.Listen("127.0.0.1:3001")|g' FiberConfig/Routes.go
          fi

      - name: Build Go application for Ubuntu
        run: |
          GOOS=linux GOARCH=amd64 CGO_ENABLED=1 go build -o main ./main.go
          chmod +x main

      - name: Prepare deployment package
        run: |
          # We create the tarball directly from the root
          # We include the binary 'main' and all source files
          # We EXCLUDE git history, github actions, and the tarball itself to save space
          tar -czf deployment.tar.gz \
            --exclude='deployment.tar.gz' \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='uploads' \
            .

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Deploy to VPS
        run: |
          cat > deploy.sh << 'EOF'
          #!/bin/bash
          sudo mkdir -p /var/www/FalconGo
          sudo systemctl stop Falcon || true

          # ✅ BACKUP DATABASE (Keep this safe during overwrite)
          if [ -f /var/www/FalconGo/database.db ]; then
            cp /var/www/FalconGo/database.db /tmp/database.db.temp
          fi

          # ✅ BACKUP UPLOADS
          if [ -d /var/www/FalconGo/uploads ]; then
            mv /var/www/FalconGo/uploads /tmp/uploads.temp
          fi

          # Extract everything (Source + Binary)
          echo "Extracting Source Code and Binary..."
          sudo tar -xzf /tmp/deployment.tar.gz -C /var/www/FalconGo

          # ✅ RESTORE DATABASE
          if [ -f /tmp/database.db.temp ]; then
            mv /tmp/database.db.temp /var/www/FalconGo/database.db
          fi

          # ✅ RESTORE UPLOADS
          if [ -d /tmp/uploads.temp ]; then
            mv /tmp/uploads.temp /var/www/FalconGo/uploads
          else
            mkdir -p /var/www/FalconGo/uploads
          fi

          chmod +x /var/www/FalconGo/main
          sudo chown -R root:root /var/www/FalconGo
          
          # Restart service
          sudo systemctl restart Falcon
          EOF

          chmod +x deploy.sh
          scp -i ~/.ssh/deploy_key -P ${{ secrets.SSH_PORT }} deployment.tar.gz ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/tmp/
          scp -i ~/.ssh/deploy_key -P ${{ secrets.SSH_PORT }} deploy.sh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/tmp/
          ssh -i ~/.ssh/deploy_key -P ${{ secrets.SSH_PORT }} ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "bash /tmp/deploy.sh"

      - name: Verify deployment
        run: |
          ssh -i ~/.ssh/deploy_key -P ${{ secrets.SSH_PORT }} ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "systemctl status Falcon | grep 'active'" || true