name: Build and Deploy Falcon Go App

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4 # Updated to v4 for better performance

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.21"
          cache: true

      - name: Install dependencies
        run: go mod download

      - name: Ensure HTTP on localhost
        run: |
          # Rebinds Fiber from TLS to local port 3001 for VPS reverse proxy
          sed -i 's|^\(\s*\)app\.ListenTLS(.*|\1// &|g' FiberConfig/Routes.go
          sed -i 's|// app\.Listen(":3001")|app.Listen("127.0.0.1:3001")|g' FiberConfig/Routes.go
          if grep -qE "^\s*app\.Listen\(\":3001\"\)" FiberConfig/Routes.go; then
            sed -i 's|app\.Listen(":3001")|app.Listen("127.0.0.1:3001")|g' FiberConfig/Routes.go
          fi

      - name: Build Go application
        run: |
          # CGO_ENABLED=0 creates a static binary that works on any Linux distro
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -o main ./main.go
          chmod +x main

      - name: Prepare deployment package
        run: |
          # FIXED: Create tarball in /tmp to avoid "file changed as we read it" error
          tar -czf /tmp/deployment.tar.gz \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='uploads' \
            --exclude='bge-m3' \
            --exclude='local_dir' \
            .
          mv /tmp/deployment.tar.gz .

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Deploy to VPS
        run: |
          cat > deploy.sh << 'EOF'
          #!/bin/bash
          APP_DIR="/var/www/FalconGo"
          sudo mkdir -p $APP_DIR
          sudo systemctl stop Falcon || true

          # ✅ PROTECT CRITICAL DATA
          # Move DB, Uploads, and your AI Model to /tmp so they aren't overwritten
          [ -f $APP_DIR/database.db ] && mv $APP_DIR/database.db /tmp/database.db.temp
          [ -d $APP_DIR/uploads ] && mv $APP_DIR/uploads /tmp/uploads.temp
          [ -d $APP_DIR/bge-m3 ] && mv $APP_DIR/bge-m3 /tmp/bge-m3.temp
          [ -d $APP_DIR/local_dir ] && mv $APP_DIR/local_dir /tmp/local_dir.temp

          # Clear the directory for a clean source/binary sync
          sudo rm -rf $APP_DIR/* # Extract everything
          echo "Extracting Source + Binary..."
          sudo tar -xzf /tmp/deployment.tar.gz -C $APP_DIR

          # ✅ RESTORE PROTECTED DATA
          [ -f /tmp/database.db.temp ] && mv /tmp/database.db.temp $APP_DIR/database.db
          [ -d /tmp/uploads.temp ] && mv /tmp/uploads.temp $APP_DIR/uploads
          [ -d /tmp/bge-m3.temp ] && mv /tmp/bge-m3.temp $APP_DIR/bge-m3
          [ -d /tmp/local_dir.temp ] && mv /tmp/local_dir.temp $APP_DIR/local_dir

          # Final setup
          chmod +x $APP_DIR/main
          sudo chown -R ${{ secrets.SSH_USER }}:$(id -gn ${{ secrets.SSH_USER }}) $APP_DIR
          
          sudo systemctl restart Falcon
          EOF

          chmod +x deploy.sh
          scp -i ~/.ssh/deploy_key -P ${{ secrets.SSH_PORT }} deployment.tar.gz ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/tmp/
          scp -i ~/.ssh/deploy_key -P ${{ secrets.SSH_PORT }} deploy.sh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/tmp/
          ssh -i ~/.ssh/deploy_key -P ${{ secrets.SSH_PORT }} ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "bash /tmp/deploy.sh"